.fadein{animation:fadeUp 0.3s ease both}
.slidein{animation:slideIn 0.35s ease both}
.slideup{animation:slideUp 0.4s ease both}
.spin{animation:spin 1s linear infinite}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#d0d5de;border-radius:99px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sim-layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.two-col-form{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.dist-meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.dist-pros{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){
  html{font-size:15px}
  .grid-2,.sim-layout,.two-col-form,.dist-pros{grid-template-columns:1fr}
  .dist-meta{grid-template-columns:1fr 1fr}
  .nav-label{display:none}
}
@media(max-width:480px){
  html{font-size:14px}
  .grid-2{grid-template-columns:1fr}
  .dist-meta{grid-template-columns:1fr 1fr}
}
/* Tablet portrait: 701–1024px */
@media(min-width:701px) and (max-width:1024px){
  .sim-layout{grid-template-columns:1fr 1fr;gap:18px}
  .grid-2{grid-template-columns:1fr 1fr;gap:12px}
  .two-col-form{grid-template-columns:1fr 1fr;gap:14px}
  .dist-meta{grid-template-columns:1fr 1fr 1fr}
  .dist-pros{grid-template-columns:1fr 1fr}
}
/* Phone landscape: nav labels show */
@media(max-width:700px) and (orientation:landscape){
  .nav-label{display:block;font-size:11px}
}
/* Phone landscape sim single column */
@media(max-width:960px) and (orientation:landscape) and (max-height:500px){
  .sim-layout,.two-col-form{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr 1fr}
}
/* Touch-friendly tap targets */
@media(hover:none){
  button{min-height:40px}
  input[type=range]::-webkit-slider-thumb{width:36px;height:36px}
}
/* Prevent text overflow on small screens */
@media(max-width:400px){
  html{font-size:13px}
}
</style>

const WT={amazon:{ov:"Amazon has hundreds of tallow balms — none with Talloren®, GCP clinical proof, single-farm Greenfields sourcing, or South African botanicals. Zero BS competes on science and story, not price. At $45–75, it belongs in a category of one.",tl:"3–6 months to first sale",df:"Medium",steps:[{t:"Register as an Amazon Seller",ic:"📋",ph:"Setup",tm:"1–2 weeks",wh:"Create an Amazon Seller Central account (Professional plan — $39.99/month).",wy:"You can't list a single product without this.",tp:["Use a US business address if possible","Have bank details, tax ID, and government ID ready","Choose Professional from day one"],wa:"Amazon may ask for additional verification for international sellers."},{t:"Apply for Brand Registry",ic:"🛡️",ph:"Setup",tm:"1–3 weeks",wh:"Register your brand trademark with Amazon's Brand Registry program.",wy:"Unlocks A+ Content, brand protection tools, and sponsored ads.",tp:["Start US trademark application early — 12–18 months","Amazon IP Accelerator can fast-track access","Brand Registry is free once you have a trademark"],wa:"Without Brand Registry you're vulnerable to hijacked listings."},{t:"FDA Compliance & Labeling",ic:"⚖️",ph:"Compliance",tm:"2–4 weeks",wh:"Ensure every product label meets US FDA cosmetic requirements.",wy:"Amazon actively removes non-compliant listings.",tp:["Register under FDA MoCRA at fda.gov — free","Check Amazon's restricted substances list","Use a US cosmetic regulatory consultant if unsure"],wa:"Any SPF or drug claims trigger OTC drug rules — much stricter."},{t:"Import & FBA Fulfillment",ic:"🚢",ph:"Logistics",tm:"3–6 weeks",wh:"Ship inventory to Amazon FBA warehouses for Prime eligibility.",wy:"FBA gives Prime badge, faster delivery, and better ranking.",tp:["Confirm import duty rate at usitc.gov","Use a licensed customs broker","Budget 30–40% of sale price for total Amazon fees"],wa:"FBA requires exact labelling and packaging specs."},{t:"Create Product Listings",ic:"📸",ph:"Launch",tm:"1–2 weeks",wh:"Build product pages with title, bullets, A+ Content, and high-quality images.",wy:"Your listing is your store — weak copy = low conversion.",tp:["Invest in professional product photography","Research competitor keywords","Use Helium 10 or Jungle Scout for keyword research"],wa:"Keyword stuffing can get listings suppressed."},{t:"Launch Advertising",ic:"📣",ph:"Growth",tm:"Ongoing",wh:"Run Amazon PPC ads from day one and enrol in Amazon Vine for reviews.",wy:"New listings have zero organic ranking — ads buy visibility.",tp:["Budget $1,000–$2,000/month for first 3 months","Amazon Vine gets up to 30 verified reviews","Aim for 4.2+ star average"],wa:"Never offer discounts in exchange for reviews — account suspension risk."}]},sephora:{ov:"Sephora is prestige beauty's biggest stage. Tallow doesn't fit the current Clean Seal — but Warren Wilensky's founder story, Talloren®'s GCP clinical proof, and a formula born from treating his daughter's psoriasis is exactly the kind of human story Sephora Accelerate was built for.",tl:"12–24 months from first contact to shelf",df:"Very High",steps:[{t:"Understand the Tallow Challenge",ic:"⚠️",ph:"Research",tm:"1–2 weeks",wh:"Sephora's Clean Seal program favors plant-derived formulations. No tallow-based products have been historically listed. Their ingredient standards currently classify tallow as outside their 'clean' definition.",wy:"Going in blind about this will waste months. The path into Sephora for tallow requires a dermatologist-credibility strategy, not just a clean-beauty pitch.",tp:["Build a clinical credibility file first: ingredient safety data, consumer perception study, derm endorsement","The entry ticket is dermatologist approval — not a bonus, it's the requirement","Consider DTC + clinical sales as a 12–18 month foundation before approaching Sephora","Indie beauty is growing at +22% YOY — Sephora is actively looking for new stories, but the science must be airtight"],wa:"Approaching Sephora without a dermatologist-credibility story is premature — buyers will reject immediately."},{t:"Build US Brand Foundation",ic:"🏗️",ph:"Pre-application",tm:"6–12 months",wh:"Compelling brand story, US-compliant packaging, professional website, active US social traction, and DTC proof of demand. Price at $42–45 for retail to absorb wholesale margins.",wy:"Sephora buyers evaluate your brand holistically — DTC sales data is your most powerful proof point. They want to see US consumer demand before any meeting.",tp:["Grow US social following to 10,000–50,000 before applying","Price at $42–45 for retail channels — $38 for DTC soft launch","Talloren® + wild Cape & sub-Saharan botanicals + single Greenfields farm + edible-safe formula = a story no US brand can copy","Retailer invoice price is 45–55% of MSRP — model P&L at 55% before any commitment"],wa:"Sephora Clean requires products free of 50+ restricted ingredients — have regulatory counsel review your full INCI list."},{t:"Sephora Accelerate Program",ic:"🔍",ph:"Pre-application",tm:"2–4 weeks",wh:"Apply to Sephora Accelerate — their beauty incubator for emerging brands. Gives mentorship, buyer access, and a direct path to consideration. Required for most indie brands entering Sephora.",wy:"Past participants reached shelves within 12 months. It's the structured path in — cold outreach to buyers rarely works.",tp:["Applications open late summer at sephora.com/accelerate","Prioritises diverse founders and innovative ingredient stories","Have pitch deck, DTC sales data, and financials ready","Sephora Accelerate includes a dedicated retail-readiness curriculum"],wa:"Highly competitive — have pitch deck and financials ready. Apply to RangeMe in parallel."},{t:"FDA Compliance & MoCRA",ic:"⚖️",ph:"Compliance",tm:"4–8 weeks",wh:"Meet FDA MoCRA requirements AND Sephora's internal Clean standards. Register facility, get FEI number, and have full ingredient deck with annual update plan.",wy:"Sephora may reject FDA-compliant ingredients if they fall outside their Clean criteria. MoCRA registration is the baseline — Sephora Clean is the ceiling.",tp:["Register free at fda.gov/cosmetics to get FEI number","INCI list in descending weight order — mandatory","Mark 'Made in South Africa' on primary artwork","Avoid 'heals', 'treats', 'anti-inflammatory' — use 'moisturises', 'soothes'"],wa:"OTC drug claims require significantly more documentation — will stall your Sephora application."},{t:"EDI & Operational Readiness",ic:"💻",ph:"Operational",tm:"4–8 weeks",wh:"Mandatory EDI integration via providers like SPS Commerce. Sephora requires automated POs and invoices. Also requires DC routing compliance and B2B labeling.",wy:"Getting onto the shelf is gate one. Shipping like a Sephora vendor requires institutional-grade operations — EDI is non-negotiable.",tp:["Partner with SPS Commerce for EDI setup","Budget $2,000–$5,000 for EDI setup costs","DC compliance and charge-back allowances (3–5%) must be built into your pricing","Operational readiness investment: $120k–$250k low scenario, $300k–$700k mid scenario"],wa:"Brands get hit with Sephora charge-backs for non-compliance. These can seriously damage cash flow in year one."},{t:"Launch & In-Store Support",ic:"🚀",ph:"Launch",tm:"Ongoing",wh:"Plan in-store events, Sephora app features, replenishment logistics, and a DTC-first proof of demand deck. Lead with 3–5 hero SKUs — not your full range.",wy:"Sell-through in first 6 months determines whether you stay on shelf. Sephora reviews all brands annually.",tp:["Lead with 3–5 SKU assortment — ingredient legitimacy and concern-solution clarity","Budget for Sephora's paid marketing programs (high cost)","Hire a US brand ambassador for in-store events","Supply chain must handle rapid reorders — US 3PL essential"],wa:"Sephora reviews all brands annually against sell-through targets. Miss them and you're pulled. Invest heavily in the first 6 months."}]},wholefoods:{ov:"Zero BS is exactly the brand Whole Foods wants in 2026: water-free, microbiome-safe, single-farm Greenfields sourcing, Cape Town botanicals, edible-safe food-grade ingredients, and a founder origin story rooted in healing. The LEAP accelerator was designed for brands like this.",tl:"9–18 months from application to shelf",df:"High",steps:[{t:"Clean Credential Audit",ic:"🌿",ph:"Pre-application",tm:"4–8 weeks",wh:"Audit your formula against Whole Foods' 240+ banned ingredients list. Screen for parabens, phthalates, sulfates, and synthetic fragrances.",wy:"WF will reject your application immediately if any formula contains a banned ingredient — this is the non-negotiable first step.",tp:["Download WF's Unacceptable Ingredients for Body Care list","Tallow itself is fine — check all secondary ingredients carefully","EWG Verified or Leaping Bunny certification fast-tracks buyer trust","INCI syntax must follow descending order of weight on labels"],wa:"'Natural' is not a protected term. Only Whole Foods' ingredient list matters — not your marketing claims."},{t:"Apply via LEAP Accelerator",ic:"🌱",ph:"Application",tm:"4–8 weeks",wh:"Apply to Whole Foods' Local & Emerging Accelerator Program (LEAP). It lets new brands bypass UNFI entirely and sell direct to local WF stores — up to $25,000 in financial support available.",wy:"LEAP is the single most realistic entry point for Zero BS. It removes the UNFI distributor margin (18%) and gives mentorship plus a local proof-of-concept before going national.",tp:["LEAP is 12 weeks — mentorship, curriculum, and a path to local NY/CA stores","Apply at wholefoodsmarket.com/supplier — new windows open periodically","Bring: clean credentials, sell sheet, FDA registration, and UPC barcodes","Having a 'local' presence (US LLC) helps LEAP eligibility"],wa:"LEAP doesn't guarantee placement — but it dramatically increases your odds vs. cold outreach."},{t:"Establish US LLC & Banking",ic:"🏛️",ph:"Compliance",tm:"1–2 weeks",wh:"Form a Delaware LLC to serve as the official US Importer of Record. Secure US business banking.",wy:"Whole Foods requires a US business entity. It's also required for FDA registration and is the 'Master Key' that unlocks Amazon, clinical, and all retail channels.",tp:["Delaware LLC formation costs $500–$1,500 via a formation service","Appoint a US Registered Agent (Registrar Corp works well)","Mercury or Relay are good US banking options for foreign founders","Your EIN (tax ID) will be needed for all distributor and retail applications"],wa:"Don't try to operate as a foreign entity — US retailers won't engage without a US LLC."},{t:"FDA Registration & Labeling",ic:"⚖️",ph:"Compliance",tm:"2–4 weeks",wh:"Register under FDA MoCRA (free at fda.gov/cosmetics). Get your FEI number. Remediate all labels to INCI syntax and remove any drug-like claims ('heals', 'treats', 'anti-inflammatory').",wy:"Your FEI number is the 'Master Key' required for Amazon, Whole Foods, and all retail approval. Label remediation blocks most foreign brands from entering.",tp:["MoCRA registration is free — takes 1–2 weeks","FEI number comes from FDA Facility Registration","Change 'heals' to 'moisturises' — 'treats' to 'soothes'","Mark 'Made in South Africa' on primary artwork"],wa:"Drug claims put you in OTC territory — an entirely different, expensive regulatory pathway."},{t:"US Logistics: Ship Once, Sell Everywhere",ic:"🚢",ph:"Logistics",tm:"4–8 weeks",wh:"Ship one bulk order from Cape Town to a US warehouse. Pay the 30% tariff once on that bulk shipment. From one US warehouse, fulfil Shopify, supply Whole Foods, and reach Sephora — all from the same location.",wy:"De minimis ($800 duty-free threshold) was permanently eliminated in August 2025. Direct SA-to-customer shipping costs $18–35/unit before tariff — it's economically unviable. Every successful foreign skincare brand pre-positions US inventory.",tp:["Capacity LLC in New Jersey is the recommended US 3PL for beauty brands — they supply both WF and Sephora","ShipBob is a strong alternative for smaller initial volumes","LCL (less-than-container) shipping from Cape Town to Port Newark takes 25–35 days","Budget $100–200 per cubic meter for shared container space","30% tariff is paid once on the bulk shipment — then goods move freely inside the US"],wa:"Don't take a single US order before your 3PL is live. The per-package customs cost and delay will destroy your first impressions."},{t:"Buyer Pitch & Expo West",ic:"🎤",ph:"Pitch",tm:"3–6 months",wh:"Exhibit or attend Natural Products Expo West in Anaheim — WF's primary brand discovery event. Also engage a WF regional broker for Northeast or West Coast region first.",wy:"WF buyers actively discover new brands at Expo West. A fynbos and tallow story is one a wellness-educated store associate can tell — exactly the type of provenance story WF wants in 2026.",tp:["WF's 2026 trend forecast names functional ingredients and skin-as-wellness as top priorities — tallow maps directly onto this","Target NYC/LA/SF region first — highest clean beauty density","In-store demo events lift velocity 20–30% — budget $110/location","Mandatory in-store demos are required to build customer sales velocity"],wa:"WF reviews velocity quarterly. Low-selling SKUs are pulled. Launch in fewer stores and concentrate support — 10 high-velocity stores beats 30 weak ones."}]},dtc:{ov:"DTC is where the Zero BS story comes alive in full: Warren Wilensky founding the brand to treat his daughter's psoriasis, Talloren® from a single Greenfields KZN farm, wild Cape botanicals, and a formula so pure it's edible-safe. No US brand can copy this. Critical: de minimis is gone — a US 3PL is mandatory.",tl:"2–4 months to launch",df:"Medium",steps:[{t:"US-Ready Website & Pricing",ic:"💻",ph:"Setup",tm:"2–4 weeks",wh:"Shopify store with USD pricing, US shipping options, and a US returns policy. Price at $38 for DTC launch — comparable tallow brands (Vintage Tradition, Fatco) sell $38–65.",wy:"US customers won't buy from a site showing ZAR prices. Price is also a brand signal — raising it signals quality, not just financial necessity.",tp:["Use Shopify for native US tax and payment processing","Price DTC at $38 minimum — $42–45 for retail channels","Talloren® + wild Cape botanicals + single-farm provenance + founded to treat psoriasis = a premium story US consumers will pay $45–65 for","Display US shipping rates and a clear return policy on every page"],wa:"Don't use .co.za for US customers. Use .com or a dedicated US subdomain."},{t:"Why You Can't Ship Direct from SA",ic:"🚢",ph:"Critical",tm:"Understand before launch",wh:"De minimis — the rule that let packages under $800 enter the US duty-free — was permanently eliminated in August 2025. Every package now gets taxed and goes through customs. International shipping for a small skincare parcel: $18–35 per package, before the 30% tariff is added.",wy:"Zero BS would lose money on every single sale before spending anything on marketing. This isn't optional — the economics of direct SA shipping simply don't work.",tp:["Ship one large bulk order from Cape Town to a US warehouse — pay the 30% tariff once on the entire shipment","Once goods are inside the US, they move freely with no additional import tax","From one US warehouse, you can fulfil Shopify orders in 3–5 days AND supply Whole Foods and Sephora","Capacity LLC in New Jersey is the recommended US 3PL — specialises in beauty brands, supplies both WF and Sephora","ShipBob and ShipMonk are strong alternatives for smaller initial volumes"],wa:"Do not take a single US order before your US 3PL is operational. The first impression you make on a US customer matters enormously."},{t:"FDA MoCRA Registration",ic:"⚖️",ph:"Compliance",tm:"1–2 weeks",wh:"Register your facility under FDA MoCRA (free at fda.gov/cosmetics). Get your FEI number. Required for all foreign facilities shipping to the US.",wy:"Legally required, signals professionalism, and is needed for all US retail channels later.",tp:["Register free at fda.gov/cosmetics","FEI number is the 'Master Key' for Amazon and retail approval","Keep confirmation for customs clearance on your bulk shipment"],wa:"MoCRA also requires Serious Adverse Event reporting within 15 business days."},{t:"US Labeling Compliance",ic:"🏷️",ph:"Compliance",tm:"2–3 weeks",wh:"English INCI list in descending weight order, net content in both oz AND ml, US company address, required warnings. Remove drug-like claims ('heals', 'treats').",wy:"CBP can seize non-compliant shipments. Labeling issues are the most common reason foreign skincare brands get held at the border.",tp:["INCI names must appear prominently — minimum 1/16 inch font","Must show both fl oz and ml — metric alone fails US customs","Mark 'Made in South Africa' on primary artwork","US agent address on label is acceptable if no US office"],wa:"Drug claims ('heals eczema', 'treats acne') put you in OTC territory — completely different regulatory pathway."},{t:"US Customer Acquisition",ic:"📣",ph:"Marketing",tm:"Ongoing",wh:"TikTok, Meta, email marketing, and influencer partnerships to drive US traffic. The tallow ancestral-skincare story has real viral potential — #TallowSkincare and #SkinTok are growing communities.",wy:"Unlike Amazon or Sephora, you have no built-in audience. But the tallow story is one no mainstream brand can copy.",tp:["TikTok is highest-ROI channel for skincare discovery — founder story, tallow explainer, and transformation content perform well","Partner with clean beauty and ancestral-wellness micro-influencers (5k–100k followers)","Build email list from day one — email is 10–30× cheaper per conversion than paid ads for repeat purchase","US digital CAC is $30–80 — focus on LTV through post-purchase education and repeat purchase flows"],wa:"Never ship from SA directly to customers — always from your US 3PL warehouse. Customers in the US expect 3–5 day delivery."},{t:"Reviews & Social Proof",ic:"⭐",ph:"Growth",tm:"Ongoing",wh:"Automate post-purchase review requests via Klaviyo. Showcase before/after content. DTC skincare is only profitable through repeat purchase.",wy:"US consumers don't trust brands they don't know — reviews and social proof build that trust faster than any ad.",tp:["Post-purchase review request 7–14 days after delivery","Incentivise photo reviews with 10% off next order","Tallow skincare requires technique education — brands that educate retain customers at 2× the rate","Target 25%+ repeat purchase rate within 60 days"],wa:"Never buy or fake reviews — US consumers are savvy. One fake review scandal can permanently damage a brand."}]},clinical:{ov:"Zero BS has the strongest clinical foundation of any tallow brand: GCP-tested under independent labs, dermatologist-approved, and with a founder origin story in treating psoriasis — the exact condition dermatologists see daily. Clinical is where this science pays the most.",tl:"12–18 months to first meaningful revenue",df:"High",steps:[{t:"Clinical Credibility File",ic:"📄",ph:"Pre-sales",tm:"2–4 months",wh:"Ingredient safety data sheets, consumer perception study, dermatologist-tested claim.",wy:"Dermatologists are trained scientists — they won't recommend without evidence.",tp:["Consumer perception study costs $5,000–$15,000 but is transformative","Tallow has published research on skin barrier restoration — compile it","Get one US board-certified dermatologist to trial and endorse the product"],wa:"'Treats' or 'heals' language is an OTC drug claim under FDA rules."},{t:"FDA MoCRA & Safety Dossier",ic:"⚖️",ph:"Compliance",tm:"1–3 weeks",wh:"MoCRA registration plus a product safety dossier and SDS for each SKU.",wy:"Clinical professionals are liable — they will ask for safety documentation.",tp:["MoCRA registration free at fda.gov","Create a 1-page safety summary per SKU","Have INCI list reviewed by a US cosmetic chemist"],wa:"California has additional state-level cosmetic regulations."},{t:"Clinical Sales Kit",ic:"🧴",ph:"Sales materials",tm:"3–4 weeks",wh:"Product brochure, protocol guide, dispensary margin sheet, and sample kit.",wy:"Practitioners are busy — your kit must make recommending you effortless.",tp:["Include a 'how to talk to patients' script","Show dispensary margin clearly: 40–50% on retail","Create before/after photography protocols"],wa:"Have a regulatory consultant review all clinical language."},{t:"Medical Sales Rep",ic:"🤝",ph:"Sales",tm:"4–8 weeks",wh:"Commission-based US aesthetic sales rep with existing practitioner relationships.",wy:"Cold calling dermatologist offices without a trusted rep is nearly impossible.",tp:["Find reps via NCEA.tv or LinkedIn","15–20% commission-only reps are low-risk","Target medical spas first — more entrepreneurial than derm offices"],wa:"Reps carrying competing lines may deprioritise your brand."},{t:"KOL Partnerships",ic:"🌟",ph:"Marketing",tm:"Ongoing",wh:"Partner with 3–5 US dermatologists or aesthetic practitioners with strong social followings.",wy:"One credible derm endorsement is worth more than $100,000 of advertising.",tp:["Look for derms active on Instagram or TikTok in clean beauty niche","Offer free product, co-created content, and sales commission","Build the relationship before asking for content"],wa:"FTC requires clear disclosure of all paid partnerships."},{t:"Trade Show Presence",ic:"🎪",ph:"Growth",tm:"Ongoing",wh:"Exhibit at IECSC, ASCP Skin Care Show, or AAD Annual Meeting.",wy:"These events are where practitioners discover and purchase new products.",tp:["IECSC is the best starting point for med spa outreach","Offer a first-order show special","Follow up within 48 hours of the event"],wa:"Booth costs $3,000–$10,000+. Have a clear lead capture process."}]},bluemercury:{ov:"Zero BS's clinical luxury story — Talloren®, GCP-tested, single Greenfields farm, Cape botanicals — is a perfect fit for Bluemercury's apothecary model. Their trained staff are skincare educators who actively explain ingredient science to high-income customers.",tl:"9–18 months from first contact to shelf",df:"High",steps:[{t:"Understand Bluemercury's Model",ic:"🏪",ph:"Research",tm:"1–2 weeks",wh:"Bluemercury is a luxury apothecary chain (180+ boutiques) owned by Macy's. They specialise in premium skincare and trained staff conduct skin consultations.",wy:"Bluemercury staff will genuinely explain Talloren® science to customers — a rare selling environment that matches Zero BS's clinical story.",tp:["Targets high-income shoppers who spend $80–200+ on skincare","Clean Beauty standards are strict — have your ingredient list reviewed","US LLC, FDA MoCRA registration, and premium packaging are table stakes","Establish DTC traction first — buyers want proof of US demand"],wa:"Bluemercury is selective — don't approach without DTC data and press coverage."},{t:"Build Clinical & Luxury Dossier",ic:"📄",ph:"Pre-application",tm:"2–3 months",wh:"Compile GCP clinical results, Talloren® ingredient story, dermatologist endorsement, and a premium pitch deck positioning Zero BS as the clinical luxury tallow brand.",wy:"Bluemercury buyers respond to clinical science told through a luxury lens.",tp:["Position Zero BS as 'clinical luxury' — not just clean beauty","Lead with the Greenfields KZN farm story and the psoriasis founding narrative","GCP clinical testing is rare in indie beauty — major differentiator","Target $55–80 pricing for Bluemercury positioning"],wa:"Pricing below $50 will feel out of place in Bluemercury's portfolio."},{t:"FDA & US Compliance",ic:"⚖️",ph:"Compliance",tm:"2–4 weeks",wh:"FDA MoCRA registration, FEI number, full INCI list, and US-compliant labeling.",wy:"Required by all US retailers — signals professionalism to Bluemercury buyers.",tp:["MoCRA registration free at fda.gov","Remove drug claims — use 'soothes', 'nourishes', 'supports skin barrier'","Mark 'Made in South Africa' on packaging — it's a provenance asset","GS1 barcodes required for retail inventory systems"],wa:"Label non-compliance is the fastest way to lose a retail relationship."},{t:"Buyer Outreach",ic:"🤝",ph:"Outreach",tm:" function MultiCheck({f,value,onChange}){
  const sel=Array.isArray(value)?value:(value?[value]:[]);
  const tog=o=>{const n=sel.includes(o)?sel.filter(x=>x!==o):[...sel,o];onChange(n);};
  return(<div style={{display:"flex",flexDirection:"column",gap:8}}>{f.options.map(o=>{const on=sel.includes(o);return(<label key={o} onClick={()=>tog(o)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 15px",borderRadius:12,border:`2px solid ${on?"#ff6b2b":"#d8dde6"}`,background:on?"#fff4ef":"#fff",cursor:"pointer",userSelect:"none"}}><div style={{width:22,height:22,borderRadius:6,border:`2.5px solid ${on?"#ff6b2b":"#d8dde6"}`,background:on?"#ff6b2b":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{on&&<span style={{color:"#fff",fontSize:15,fontWeight:900}}>✓</span>}</div><span style={{fontSize:17,fontWeight:on?700:500,color:on?"#c84e12":"#374151"}}>{o}</span></label>);})}{sel.length>0&&<div style={{display:"flex",gap:7,flexWrap:"wrap",marginTop:2}}>{sel.map(s=><span key={s} style={{background:"#ff6b2b",color:"#fff",fontSize:16,fontWeight:700,padding:"3px 11px",borderRadius:99}}>{s}</span>)}</div>}</div>);
}
function Fld({f,value,onChange}){
  const s={width:"100%",padding:"13px 16px",border:"2px solid #d8dde6",borderRadius:12,fontSize:17,color:"#1a1a1a",background:"#fff",outline:"none"};
  if(f.type==="multicheck")return <MultiCheck f={f} value={value} onChange={onChange}/>;
  if(f.type==="select")return <select value={value||""} onChange={e=>onChange(e.target.value)} style={{...s,cursor:"pointer"}}><option value="">— select one —</option>{f.options.map(o=><option key={o} value={o}>{o}</option>)}</select>;
  return <div style={{display:"flex",alignItems:"center",gap:8}}>{f.unit==="$"&&<span style={{fontSize:17,color:"#555",fontWeight:700}}>$</span>}<input type="number" value={value||""} placeholder={f.placeholder} onChange={e=>onChange(e.target.value)} style={{...s,flex:1}}/>{f.unit&&f.unit!=="$"&&<span style={{fontSize:16,color:"#555",fontWeight:600,whiteSpace:"nowrap"}}>{f.unit==="u"?"units":f.unit}</span>}</div>;
}
function Dots({cur,tot,cols}){return <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:28}}>{Array.from({length:tot},(_,i)=><div key={i} style={{width:i===cur?32:12,height:12,borderRadius:99,background:i<cur?"#e0faf4":i===cur?cols[i]:"#d0d5de",border:i===cur?`2px solid ${cols[i]}`:"none",transition:"all 0.3s"}}/>)}</div>;}
function Mini({value,onChange,pre,suf,w=68}){return <div style={{display:"flex",alignItems:"center",gap:3}}>{pre&&<span style={{fontSize:17,fontWeight:700,color:"inherit"}}>{pre}</span>}<input type="number" value={value} onChange={e=>{const n=parseFloat(e.target.value);if(!isNaN(n))onChange(n);}} style={{width:w,padding:"5px 7px",border:"none",outline:"none",fontSize:19,fontWeight:900,color:"inherit",background:"transparent",textAlign:"center"}}/>{suf&&<span style={{fontSize:15,fontWeight:700,color:"inherit",whiteSpace:"nowrap"}}>{suf}</span>}</div>;}

function VCard({v,val,msrp,onChange}){
  const pct=((val-v.min)/(v.max-v.min))*100;
  const cl=n=>Math.min(v.max,Math.max(v.min,n));
  const gd=()=>v.id==="cogs"?parseFloat(((val/100)*msrp).toFixed(2)):val;
  const gp=()=>v.id==="cogs"?val:msrp>0?parseFloat(((val/msrp)*100).toFixed(1)):0;
  const fd=d=>v.id==="cogs"?(msrp>0?parseFloat(((d/msrp)*100).toFixed(1)):val):d;
  const fp=p=>v.id==="cogs"?p:parseFloat(((p/100)*msrp).toFixed(2));
  return(<div style={{background:"#fff",border:"2px solid #e4e8ef",borderRadius:18,padding:"18px 20px"}}><div style={{display:"flex",alignItems:"center",gap:11,marginBottom:13}}><div style={{width:40,height:40,borderRadius:11,background:`${v.color}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{v.icon}</div><div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:800,color:C.dark,lineHeight:1.2}}>{v.label}</div><div style={{fontSize:15,color:"#3d4452"}}>{v.sub}</div></div></div>{v.dual?(<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:13}}><div style={{background:`${v.color}12`,borderRadius:11,padding:"8px 11px",color:v.color}}><div style={{fontSize:15,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:3,opacity:0.7}}>In dollars</div><Mini value={gd()} pre="$" onChange={d=>onChange(cl(fd(parseFloat(d||0))))} w={58}/></div><div style={{background:`${v.color}12`,borderRadius:11,padding:"8px 11px",color:v.color}}><div style={{fontSize:15,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:3,opacity:0.7}}>As % of price</div><Mini value={gp()} suf="%" onChange={p=>onChange(cl(fp(parseFloat(p||0))))} w={66}/></div></div>):(<div style={{display:"inline-flex",alignItems:"center",background:`${v.color}14`,borderRadius:11,padding:"8px 14px",marginBottom:13,color:v.color}}><Mini value={v.unit==="$k"?parseFloat(val.toFixed(1)):val} pre={v.pre} suf={v.unit==="$k"?"k":v.suf} onChange={n=>onChange(cl(n))} w={v.id==="moq"?72:60}/></div>)}<input type="range" min={v.min} max={v.max} step={v.step} value={val} onChange={e=>onChange(parseFloat(e.target.value))} style={{accentColor:v.color,background:`linear-gradient(to right,${v.color} 0%,${v.color} ${pct}%,#d8dde6 ${pct}%,#d8dde6 100%)`}}/><div style={{display:"flex",justifyContent:"space-between",marginTop:5}}><span style={{fontSize:15,color:"#5a6473",fontWeight:600}}>{v.pre||""}{v.min}{v.unit==="$k"?"k":v.suf||""}</span><span style={{fontSize:15,color:"#5a6473",fontWeight:600}}>{v.pre||""}{v.max}{v.unit==="$k"?"k":v.suf||""}</span></div></div>);
}

function BrandBrainstorm(){

    setLoading(true);setAllResults(null);setActiveVibe(null);setError(null);
    const text=Object.values(ans).join(" ").toLowerCase();
    const avoid=(ans.avoid||"").toLowerCase();

    // Detect signals from any answered field
    const has=(...words)=>words.some(w=>text.includes(w));
    const isLuxury=has("luxur","premium","prestige","high-end","elegant","refined","minimal","simple");
    const isEarthy=has("earth","natur","raw","ancestral","heritage","land","grass","farm","origin","africa","cape","veld","wild");
    const isBold=has("bold","direct","honest","straight","no fluff","no bs","blunt","real","transparent","clean");
    const isPlayful=has("play","fun","cheeky","wit","humor","lightheart","quirky","warm","friendly","approachable");
    const isClinical=has("clinical","science","derm","ingredi","lab","research","evidence","medical","skin barrier","barrier","molecule");

    // Score each vibe bucket
    const vibeScores={
      earthy:  (isEarthy?4:1)+(isBold?1:0)+(Math.random()*0.8),
      bold:    (isBold?4:1)+(isEarthy?1:0)+(Math.random()*0.8),
      luxury:  (isLuxury?4:1)+(isClinical?1:0)+(Math.random()*0.8),
      playful: (isPlayful?4:1)+(isBold?1:0)+(Math.random()*0.8),
      clinical:(isClinical?4:1)+(isLuxury?1:0)+(Math.random()*0.8),
    };

    // Filter avoided words from each vibe's names
    const avoidWords=avoid.split(/[,\s]+/).filter(w=>w.length>2);
    const filterNames=(names)=>names.filter(n=>{
      const nl=n.name.toLowerCase();
      return !avoidWords.some(w=>nl.includes(w));
    });

    // Shuffle each vibe's name list slightly for variety on regenerate
    const shuffle=(arr)=>[...arr].sort(()=>Math.random()-0.48);

    const built={};
    Object.entries(NAME_POOL).forEach(([key,vibe])=>{
      const names=shuffle(filterNames(vibe.names)).slice(0,8);
      built[key]={...vibe,names,score:vibeScores[key]};
    });

    // Pick the top-scoring vibe as default active
    const topVibe=Object.entries(vibeScores).sort((a,b)=>b[1]-a[1])[0][0];

    setTimeout(()=>{setAllResults(built);setActiveVibe(av=>av||topVibe);setLoading(false);},550);
  };

  const setMakeDollar=d=>{if(price>0)setMakePct(Math.min(80,Math.max(5,parseFloat(((d/price)*100).toFixed(1)))));};

    {id:"bluemercury",label:"Bluemercury",icon:"🏺",
     retailerPct:0.50,distPct:0,platformPct:0,threeplUnit:2,
     color:"#1e3a5f",
     costBreakdown:[
       {line:"Bluemercury retail margin (~50%)",pct:0.50,perUnit:null},
       {line:"EDI/DC compliance fees (est.)",pct:null,perUnit:2},

  ];
  const ch=CHAN.find(c=>c.id===chan);

  // Total effective channel take (retailer + dist + platform) as % of price, plus per-unit fixed fees
  const totalChanPct=ch.retailerPct+ch.distPct+ch.platformPct+(ch.id==="sephora"?0.03:0)+(ch.id==="wholefoods"?0.05:0)+(ch.id==="clinical"?0.18:0);
  const totalChanFixed=ch.threeplUnit+(ch.id==="amazon"?1.5:0)+(ch.id==="clinical"?3:0);

  const marginPct=price>0?Math.round((profitPerUnit/price)*100):0;
  const yr1Revenue=price*units;
  const yr1Costs=(landedCost*units)+(chanCutTotal*units)+(mktg*12);
  const yr1Profit=yr1Revenue-yr1Costs;
  const moqCost=parseFloat((1000*landedCost).toFixed(0));
  const beUnits=profitPerUnit>0?Math.ceil(mktg/profitPerUnit):null;

  const fmt=n=>"$"+Math.round(Math.abs(n)).toLocaleString();
  const green="#06d6a0",red="#f43f5e",amber="#f59e0b";
  const profitColor=profitPerUnit>5?green:profitPerUnit>0?amber:red;
  const yr1Color=yr1Profit>0?green:yr1Profit>-5000?amber:red;

  // Slider + editable input combo
  const Slider=({emoji,label,plain,val,set,min,max,step=1,pre="",suf="",color=C.orange})=>{
    const pct=Math.min(100,Math.max(0,((val-min)/(max-min))*100));
    const[editing,setEditing]=useState(false);
    const[draft,setDraft]=useState("");
    const displayVal=typeof val==="number"&&val%1!==0?val.toFixed(1):val.toLocaleString();
    return(
      <div style={{background:"#fff",borderRadius:18,padding:"18px 20px",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,gap:10,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:17,fontWeight:800,color:C.dark,display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              <span style={{flexShrink:0}}>{emoji}</span><span>{label}</span>
            </div>
            <div style={{fontSize:15,color:"#444",marginTop:3,lineHeight:1.4}}>{plain}</div>
          </div>
          {/* Tappable value badge — click to type */}
          <div onClick={()=>{setEditing(true);setDraft(String(val));}}
            style={{background:`${color}14`,borderRadius:12,padding:"6px 14px",minWidth:80,textAlign:"center",cursor:"text",border:`2px solid ${editing?color:"transparent"}`,transition:"border 0.15s",flexShrink:0}}>
            {editing?(
              <input autoFocus type="number" value={draft}
                onChange={e=>setDraft(e.target.value)}
                onBlur={()=>{const n=parseFloat(draft);if(!isNaN(n))set(Math.min(max,Math.max(min,n)));setEditing(false);}}
                onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape"){const n=parseFloat(draft);if(!isNaN(n))set(Math.min(max,Math.max(min,n)));setEditing(false);}}}
                style={{width:70,border:"none",background:"transparent",fontSize:20,fontWeight:900,color,outline:"none",textAlign:"center"}}/>
            ):(
              <span style={{fontSize:20,fontWeight:900,color}}>{pre}{displayVal}{suf}</span>
            )}
            {!editing&&<div style={{fontSize:15,color:`${color}`,marginTop:1}}>tap to edit</div>}
          </div>
        </div>
        <input type="range" min={min} max={max} step={step} value={val}
          onChange={e=>set(parseFloat(e.target.value))}
          style={{width:"100%",marginTop:8,accentColor:color,
            background:`linear-gradient(to right,${color} 0%,${color} ${pct}%,#e4e8ef ${pct}%,#e4e8ef 100%)`}}/>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
          <span style={{fontSize:15,color:"#666"}}>{pre}{min}{suf}</span>
          <span style={{fontSize:15,color:"#666"}}>{pre}{max.toLocaleString()}{suf}</span>
        </div>
      </div>
    );
  };

  const ResultCard=({emoji,title,value,sub,color,big=false})=>(
    <div style={{background:"#fff",borderRadius:16,padding:"18px 20px",border:`2.5px solid ${color}44`,flex:"1 1 140px",minWidth:0}}>
      <div style={{fontSize:22,marginBottom:6}}>{emoji}</div>
      <div style={{fontSize:16,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:4}}>{title}</div>
      <div style={{fontSize:big?28:20,fontWeight:900,color,lineHeight:1.1,marginBottom:sub?5:0}}>{value}</div>
      {sub&&<div style={{fontSize:16,color:"#444",lineHeight:1.5,marginTop:4}}>{sub}</div>}
    </div>
  );

  const Divider=({n,label})=>(
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,marginTop:n===1?0:20}}>
      <div style={{height:2,flex:1,background:"#e4e8ef",borderRadius:99}}/>
      <span style={{fontSize:16,fontWeight:800,color:"#555",letterSpacing:"0.08em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{n} — {label}</span>
      <div style={{height:2,flex:1,background:"#e4e8ef",borderRadius:99}}/>
    </div>
  );

  return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"clamp(16px,3vw,24px) clamp(12px,3vw,16px) 56px",minHeight:"100vh"}}>

      {/* Header */}
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{fontSize:36,marginBottom:8}}>🧮</div>
        <h2 style={{fontSize:22,fontWeight:900,color:C.dark,margin:"0 0 8px"}}>U.S. Expansion Budget Calculator</h2>
        <p style={{fontSize:17,color:"#666",lineHeight:1.7,margin:"0 auto 0",maxWidth:460}}>Drag the sliders <em>or</em> tap any number to type your own. Results update instantly.</p>
      </div>

      <Divider n={1} label="Your product"/>
      <Slider emoji="💰" label="What do you sell it for?" plain="The price a US customer pays" val={price} set={setPrice} min={10} max={200} pre="$" color={C.orange}/>

      {/* COGS — dual entry: % OR $ */}
      {(()=>{
        const color="#f43f5e";
        const pct=Math.min(100,Math.max(0,((makePct-5)/(80-5))*100));
        const[editPct,setEditPct]=useState(false);
        const[editDollar,setEditDollar]=useState(false);
        const[draftPct,setDraftPct]=useState("");
        const[draftDollar,setDraftDollar]=useState("");
        const commitPct=v=>{const n=parseFloat(v);if(!isNaN(n))setMakePct(Math.min(80,Math.max(5,n)));setEditPct(false);};
        const commitDollar=v=>{const n=parseFloat(v);if(!isNaN(n))setMakeDollar(n);setEditDollar(false);};
        return(
          <div style={{background:"#fff",borderRadius:18,padding:"18px 20px",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
            <div style={{fontSize:17,fontWeight:800,color:C.dark,display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
              <span>🏭</span><span>How much does it cost to make?</span>
            </div>
            <div style={{fontSize:15,color:"#444",marginBottom:12,lineHeight:1.4}}>Enter as a <strong>% of your price</strong> or a <strong>$ amount</strong> — both stay in sync</div>
            {/* Twin badges */}
            <div style={{display:"flex",gap:10,marginBottom:12,flexWrap:"wrap"}}>
              {/* % badge */}
              <div onClick={()=>{setEditPct(true);setEditDollar(false);setDraftPct(String(makePct));}}
                style={{flex:"1 1 80px",minWidth:0,background:`${color}14`,borderRadius:12,padding:"10px 8px",textAlign:"center",cursor:"text",border:`2px solid ${editPct?color:"transparent"}`,transition:"border 0.15s",overflow:"hidden"}}>
                <div style={{fontSize:13,fontWeight:700,color:`${color}`,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4,whiteSpace:"nowrap"}}>% of price</div>
                {editPct?(
                  <input autoFocus type="number" value={draftPct}
                    onChange={e=>setDraftPct(e.target.value)}
                    onBlur={()=>commitPct(draftPct)}
                    onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")commitPct(draftPct);}}
                    style={{width:"100%",border:"none",background:"transparent",fontSize:18,fontWeight:900,color,outline:"none",textAlign:"center",minWidth:0}}/>
                ):(
                  <span style={{fontSize:19,fontWeight:900,color}}>{makePct}%</span>
                )}
                {!editPct&&<div style={{fontSize:13,color:`${color}`,marginTop:2}}>tap to edit</div>}
              </div>
              <div style={{display:"flex",alignItems:"center",fontSize:17,fontWeight:700,color:"#555",flexShrink:0}}>or</div>
              {/* $ badge */}
              <div onClick={()=>{setEditDollar(true);setEditPct(false);setDraftDollar(String(makeDollar));}}
                style={{flex:"1 1 80px",minWidth:0,background:`${color}14`,borderRadius:12,padding:"10px 8px",textAlign:"center",cursor:"text",border:`2px solid ${editDollar?color:"transparent"}`,transition:"border 0.15s",overflow:"hidden"}}>
                <div style={{fontSize:13,fontWeight:700,color:`${color}`,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:4,whiteSpace:"nowrap"}}>$ per unit</div>
                {editDollar?(
                  <input autoFocus type="number" value={draftDollar}
                    onChange={e=>setDraftDollar(e.target.value)}
                    onBlur={()=>commitDollar(draftDollar)}
                    onKeyDown={e=>{if(e.key==="Enter"||e.key==="Escape")commitDollar(draftDollar);}}
                    style={{width:"100%",border:"none",background:"transparent",fontSize:18,fontWeight:900,color,outline:"none",textAlign:"center",minWidth:0}}/>
                ):(
                  <span style={{fontSize:String(makeDollar%1!==0?makeDollar.toFixed(2):makeDollar).length>5?16:19,fontWeight:900,color,display:"block",width:"100%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${makeDollar%1!==0?makeDollar.toFixed(2):makeDollar}</span>
                )}
                {!editDollar&&<div style={{fontSize:13,color:`${color}`,marginTop:2}}>tap to edit</div>}
              </div>
            </div>
            {/* Shared slider drives % */}
            <input type="range" min={5} max={80} step={1} value={makePct}
              onChange={e=>setMakePct(parseFloat(e.target.value))}
              style={{width:"100%",accentColor:color,
                background:`linear-gradient(to right,${color} 0%,${color} ${pct}%,#e4e8ef ${pct}%,#e4e8ef 100%)`}}/>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
              <span style={{fontSize:15,color:"#666"}}>5%</span>
              <span style={{fontSize:15,color:"#666"}}>80%</span>
            </div>
          </div>
        );
      })()}
      <Slider emoji="📦" label="How much to box it up?" plain="Packaging cost per unit (jar, box, label)" val={pkg} set={setPkg} min={0.5} max={20} step={0.5} pre="$" color={C.purple}/>

      <Divider n={2} label="Getting it to the US"/>
      <Slider emoji="✈️" label="How much to ship each unit?" plain="Freight per unit from SA to a US warehouse" val={ship} set={setShip} min={0.5} max={25} step={0.5} pre="$" color={C.blue}/>
      <Slider emoji="🛃" label="Import tax rate?" plain="South Africa → US is 30% (added 2025). Zero BS pays this — not the customer." val={duty} set={setDuty} min={0} max={50} step={0.5} suf="%" color={amber}/>

      <Divider n={3} label="Where you sell"/>

      {/* Channel picker */}
      <div style={{background:"#fff",borderRadius:18,padding:"20px 22px",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
        <div style={{fontSize:17,fontWeight:800,color:C.dark,marginBottom:4}}>🏪 Which channel are you selling through?</div>
        <div style={{fontSize:15,color:"#444",marginBottom:14}}>Each option includes all fees — retailer margin, distributor cut, platform fees, and fulfilment</div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {CHAN.map(c=>{
            const totalPct=Math.round((c.retailerPct+c.distPct+c.platformPct+(c.id==="sephora"?0.03:0)+(c.id==="wholefoods"?0.05:0)+(c.id==="clinical"?0.18:0))*100);
            const fixedFee=c.threeplUnit+(c.id==="amazon"?1.5:0)+(c.id==="clinical"?3:0);
            const isActive=chan===c.id;
            return(
              <div key={c.id}>
                <button onClick={()=>setChan(c.id)}
                  style={{width:"100%",padding:"13px 16px",borderRadius:isActive?"12px 12px 0 0":"12px",border:`2.5px solid ${isActive?c.color:"#6b7280"}`,borderBottom:isActive?`2.5px solid ${c.color}`:"2.5px solid #e4e8ef",background:isActive?`${c.color}0d`:"#fafafa",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,transition:"all 0.15s",textAlign:"left"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
                    <span style={{fontSize:20,flexShrink:0}}>{c.icon}</span>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:16,fontWeight:800,color:C.dark}}>{c.label}</div>
                      <div style={{fontSize:16,color:"#444",lineHeight:1.4}}>{c.desc}</div>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:16,fontWeight:900,color:isActive?c.color:"#555"}}>{totalPct}%{fixedFee>0?` + ${fmt(fixedFee)}`:""}</div>
                    <div style={{fontSize:15,color:"#555"}}>total take</div>
                  </div>
                  {isActive&&<div style={{width:22,height:22,borderRadius:"50%",background:c.color,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{color:"#fff",fontSize:16,fontWeight:900}}>✓</span></div>}
                </button>
                {/* Expanded cost breakdown for active channel */}
                {isActive&&(
                  <div style={{background:`${c.color}08`,border:`2.5px solid ${c.color}`,borderTop:"none",borderRadius:"0 0 12px 12px",padding:"14px 16px"}}>
                    <div style={{fontSize:15,fontWeight:800,color:c.color,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:10}}>What {c.label} actually costs you</div>
                    {c.costBreakdown.map((b,i)=>(
                      <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<c.costBreakdown.length-1?"1px solid "+c.color+"22":"none"}}>
                        <span style={{fontSize:15,color:"#444"}}>{b.line}</span>
                        <span style={{fontSize:15,fontWeight:800,color:c.color}}>
                          {b.pct!=null?fmt(price*b.pct):""}{b.pct!=null&&b.perUnit!=null?" + ":""}{b.perUnit!=null?fmt(b.perUnit)+"/unit":""}
                        </span>
                      </div>
                    ))}
                    <div style={{display:"flex",justifyContent:"space-between",paddingTop:9,marginTop:4,borderTop:`1.5px solid ${c.color}44`}}>
                      <span style={{fontSize:16,fontWeight:800,color:C.dark}}>Total channel cost on ${price} sale</span>
                      <span style={{fontSize:16,fontWeight:900,color:c.color}}>{fmt(chanCutTotal)}</span>
                    </div>
                    <div style={{marginTop:10,fontSize:16,color:"#666",lineHeight:1.6,background:"#fff",borderRadius:8,padding:"8px 10px"}}>{c.note}</div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <Divider n={4} label="Your plans"/>
      <Slider emoji="📣" label="Monthly marketing spend?" plain="Ads, influencers, and PR per month" val={mktg} set={setMktg} min={500} max={50000} step={500} pre="$" color="#f472b6"/>
      <Slider emoji="🎯" label="How many units in year 1?" plain="Your sales goal for the first 12 months" val={units} set={setUnits} min={500} max={50000} step={500} suf=" units" color={C.purple}/>

      {/* ── RESULTS ── */}
      <div style={{marginTop:32}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{height:2,flex:1,background:"#e4e8ef",borderRadius:99}}/>
          <span style={{fontSize:16,fontWeight:800,color:"#555",letterSpacing:"0.08em",textTransform:"uppercase",whiteSpace:"nowrap"}}>✨ Your numbers</span>
          <div style={{height:2,flex:1,background:"#e4e8ef",borderRadius:99}}/>
        </div>

        {/* Cost per unit breakdown */}
        <div style={{background:"#fff",borderRadius:18,padding:"20px 22px",marginBottom:16,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <div style={{fontSize:17,fontWeight:900,color:C.dark,marginBottom:4}}>🧾 What it costs you to get one unit to the US</div>
          <div style={{fontSize:15,color:"#444",marginBottom:16}}>Every cost before you make a penny</div>
          {[
            {label:"To make it",val:makeCost,color:C.orange,icon:"🏭"},
            {label:"To box it",val:pkg,color:C.purple,icon:"📦"},
            {label:"To ship it",val:ship,color:C.blue,icon:"✈️"},
            {label:"Import tax",val:dutyCost,color:amber,icon:"🛃"},
          ].map(r=>{
            const pct=landedCost>0?Math.round((r.val/landedCost)*100):0;
            return(<div key={r.label} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
                <span style={{fontSize:16,fontWeight:600,color:"#444"}}>{r.icon} {r.label}</span>
                <span style={{fontSize:17,fontWeight:800,color:r.color}}>{fmt(r.val)}</span>
              </div>
              <div style={{height:10,background:"#f0f2f5",borderRadius:99,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${pct}%`,background:r.color,borderRadius:99,transition:"width 0.4s"}}/>
              </div>
            </div>);
          })}
          <div style={{display:"flex",justifyContent:"space-between",paddingTop:12,borderTop:"2px solid #f0f2f5",marginTop:8}}>
            <span style={{fontSize:17,fontWeight:900,color:C.dark}}>Total landed cost</span>
            <span style={{fontSize:18,fontWeight:900,color:C.dark}}>{fmt(landedCost)}</span>
          </div>
        </div>

        {/* Per unit profit equation */}
        <div style={{background:profitPerUnit>0?`${profitColor}0d`:"#fff5f5",borderRadius:18,padding:"22px",marginBottom:16,border:`2.5px solid ${profitColor}44`,boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <div style={{fontSize:17,fontWeight:900,color:C.dark,marginBottom:16}}>💵 What you actually pocket on each sale</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"stretch"}}>
            {[
              {label:"You charge",val:fmt(price),color:C.orange},
              {label:"Costs you",val:fmt(landedCost),color:C.blue,op:"−"},
              {label:`${ch.label} takes`,val:fmt(chanCutTotal),color:red,op:"−"},
              {label:"You keep",val:profitPerUnit>=0?fmt(profitPerUnit):`-${fmt(Math.abs(profitPerUnit))}`,color:profitColor,op:"=",sub:`${marginPct}% margin`},
            ].map(({label,val,color,op,sub},i)=>(
              <React.Fragment key={label}>
                {op&&<div style={{display:"flex",alignItems:"center",fontSize:22,color:"#666",flexShrink:0,alignSelf:"center"}}>{op}</div>}
                <div style={{flex:"1 1 110px",textAlign:"center",background:"#fff",borderRadius:14,padding:"14px 10px",border:`2px solid ${color}33`,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:5}}>{label}</div>
                  <div style={{fontSize:22,fontWeight:900,color,lineHeight:1}}>{val}</div>
                  {sub&&<div style={{fontSize:15,color,fontWeight:700,marginTop:4}}>{sub}</div>}
                </div>
              </React.Fragment>
            ))}
          </div>
          {profitPerUnit<=0&&<div style={{marginTop:14,padding:"12px 14px",background:"#fff5f5",borderRadius:12,fontSize:15,color:"#c0392b",lineHeight:1.6}}>⚠️ You're losing money on each sale. Try raising your price, lowering your COGS%, or switching to a channel that takes a smaller cut.</div>}
        </div>

        {/* Big 3 */}
        <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:16}}>
          <ResultCard emoji="💸" title="To start (1,000 unit batch)" value={fmt(moqCost)} sub={`1,000 × ${fmt(landedCost)} each`} color={C.orange} big/>
          <ResultCard emoji={yr1Profit>=0?"🎉":"😬"} title="Year 1 profit / loss" value={yr1Profit>=0?fmt(yr1Profit):`-${fmt(Math.abs(yr1Profit))}`} sub={`${units.toLocaleString()} units @ ${fmt(price)}`} color={yr1Color} big/>
          <ResultCard emoji="🏁" title="Break-even" value={beUnits?`${beUnits.toLocaleString()} sales/mo`:"N/A"} sub={beUnits?"Then you start making money":"Need positive profit per unit first"} color={C.purple} big/>
        </div>

        {/* Health check */}
        <div style={{background:"#fff",borderRadius:18,padding:"20px 22px",boxShadow:"0 2px 8px rgba(0,0,0,0.06)"}}>
          <div style={{fontSize:17,fontWeight:900,color:C.dark,marginBottom:14}}>🩺 Health check</div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {[
              {q:"Is your margin healthy?",ok:marginPct>=40,warn:marginPct>=25,good:"Yes — above 40% 👍",meh:`${marginPct}% — aim for 40%+`,bad:`Only ${marginPct}% — this is risky`},
              {q:"Is your cost to make it reasonable?",ok:makePct<=30,warn:makePct<=45,good:`${makePct}% COGS — good for US retail`,meh:`${makePct}% COGS — watch this closely`,bad:`${makePct}% COGS — too high for retail margins`},
              {q:"Will you make money in year 1?",ok:yr1Profit>0,warn:yr1Profit>-10000,good:`Yes — ${fmt(yr1Profit)} profit`,meh:`Close — ${fmt(Math.abs(yr1Profit))} short`,bad:`No — ${fmt(Math.abs(yr1Profit))} projected loss`},
              {q:"Is your marketing spend reasonable?",ok:yr1Revenue>0&&(mktg*12/yr1Revenue)<=0.30,warn:yr1Revenue>0&&(mktg*12/yr1Revenue)<=0.50,good:"Under 30% of revenue — sustainable",meh:"30–50% — manageable in year 1",bad:"Over 50% — needs more sales volume"},
            ].map(({q,ok,warn,good,meh,bad})=>{
              const color=ok?green:warn?amber:red;
              const msg=ok?good:warn?meh:bad;
              return(<div key={q} style={{display:"flex",gap:12,alignItems:"flex-start",padding:"12px 14px",background:`${color}0d`,borderRadius:12,border:`1.5px solid ${color}33`}}>
                <span style={{fontSize:18,flexShrink:0,marginTop:1}}>{ok?"✅":warn?"⚠️":"❌"}</span>
                <div>
                  <div style={{fontSize:16,fontWeight:700,color:C.dark,marginBottom:2}}>{q}</div>
                  <div style={{fontSize:15,color:"#555",lineHeight:1.5}}>{msg}</div>
                </div>
              </div>);
            })}
          </div>
        </div>

        <div style={{marginTop:14,padding:"10px 14px",background:"#f4f6f9",borderRadius:10,fontSize:16,color:"#444",lineHeight:1.6,textAlign:"center"}}>
          Estimates for planning only. Talk to a financial advisor before making big decisions.
        </div>
      </div>
    </div>
  );
}

/* ── SCORE BREAKDOWN PANEL ─────────────────────────────────── */
function ScoreBreakdown({ch,vars}){
  const ins=INS[ch.id]||[];
  return(<div style={{padding:"0 18px 18px",borderTop:`1px solid ${ch.color}22`}}><div style={{fontSize:15,fontWeight:800,color:"#444",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10,paddingTop:14}}>Score breakdown — what's helping & hurting</div><div style={{display:"flex",flexDirection:"column",gap:7}}>{ins.map(ins=>{const val=ins.f(vars);const ok=val.startsWith("✅");const warn=val.startsWith("⚠️");const bc=ok?"#06d6a0":warn?"#f59e0b":"#f43f5e";const bg=ok?"#f0fdf4":warn?"#fffbeb":"#fff5f5";return(<div key={ins.l} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 13px",background:bg,borderRadius:10,border:`1px solid ${bc}33`}}><div style={{width:28,height:28,borderRadius:"50%",background:bc,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>{ok?"✅":warn?"⚠️":"❌"}</div><div style={{flex:1,minWidth:0}}><div style={{fontSize:16,fontWeight:800,color:C.dark,marginBottom:1}}>{ins.l}</div><div style={{fontSize:16,color:"#555",lineHeight:1.45}}>{val.slice(2).trim()}</div></div><div style={{width:60,flexShrink:0}}><div style={{height:6,background:"#e4e8ef",borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:ok?"100%":warn?"50%":"15%",background:bc,borderRadius:99}}/></div><div style={{fontSize:15,color:"#555",marginTop:3,textAlign:"right"}}>{ok?"Strong":warn?"Moderate":"Weak"}</div></div></div>);})}</div></div>);
}

/* ── MAIN APP ───────────────────────────────────────────────── */
function App(){
  const[tab,setTab]=useState("strategy");
  const[phase,setPhase]=useState("brief");
  const[step,setStep]=useState(0);
  const[ans,setAns]=useState({});
  const[vars,setVars]=useState(null);
  const[wt,setWt]=useState(null);
  const[showPlan,setShowPlan]=useState(false);
  const[exCh,setExCh]=useState(null);
  const[hiddenIds,setHiddenIds]=useState(new Set());
  const[swapTarget,setSwapTarget]=useState(null);
  const toggleHide=id=>setHiddenIds(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n;});
  const[dragOrder,setDragOrder]=useState(null);
  const dragSrc=React.useRef(null);
  const onDragStart=id=>{dragSrc.current=id;};
  const onDragOver=(e,id,base)=>{e.preventDefault();if(!dragSrc.current||dragSrc.current===id)return;const from=base.indexOf(dragSrc.current),to=base.indexOf(id);if(from<0||to<0)return;const next=[...base];next.splice(from,1);next.splice(to,0,dragSrc.current);setDragOrder(next);};
  const onDragEnd=()=>{dragSrc.current=null;};

  const cur=STEPS[step];
  const cols=STEPS.map(s=>s.color);
  const scores=useMemo(()=>vars?Object.fromEntries(CHANNELS.map(ch=>[ch.id,sc(ch.id,vars)])):null,[vars]);
  const ranked=useMemo(()=>scores?[...CHANNELS].sort((a,b)=>scores[b.id]-scores[a.id]):CHANNELS,[scores]);
  const go=()=>{if(step<STEPS.length-1)setStep(s=>s+1);else{setVars(bv({...DEF,...ans}));setPhase("sim");}};

  const wtCh=wt?CHANNELS.find(c=>c.id===wt):null;
  const TABS=[{id:"strategy",label:"Market Entry",icon:"📊"},{id:"plan",label:"Marketing Plan",icon:"📈"},{id:"dist",label:"Distributors",icon:"🚚"},{id:"budget",label:"Budget Calc",icon:"🧮"},{id:"brand",label:"Brand Names",icon:"✨"}];

        <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>

          <h1 style={{fontSize:16,fontWeight:900,color:"#fff",margin:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>US Market Entry Strategy Generator</h1>
        </div>
        {tab==="strategy"&&phase==="sim"&&<button onClick={()=>{setPhase("brief");setStep(0);setWt(null);setShowPlan(false);setExCh(null);setHiddenIds(new Set());setSwapTarget(null);setDragOrder(null);}} style={{padding:"7px 14px",borderRadius:99,fontSize:14,fontWeight:800,color:C.dark,background:C.yellow,border:"none",whiteSpace:"nowrap",flexShrink:0,display:"flex",alignItems:"center",gap:5}}>✏️ Edit answers</button>}
      </div>
      <div style={{display:"flex",alignItems:"flex-end"}}>
        {TABS.map(t=>{const a=tab===t.id;return(<button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"0 4px",height:a?36:46,fontSize:13,fontWeight:700,cursor:"pointer",border:"none",borderRadius:"8px 8px 0 0",background:a?"#f0f2f5":"#2a2d42",color:a?C.dark:"#c8ccd8",display:"flex",alignItems:"center",justifyContent:"center",gap:4,boxShadow:a?"0 -2px 0 0 "+C.orange+" inset":"none",transition:"all 0.2s",minWidth:0}}><span style={{fontSize:16,flexShrink:0}}>{t.icon}</span><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:13}} className="nav-label">{t.label}</span></button>);})}
      </div>
    </div>

    <div style={{flex:1,display:"flex",flexDirection:"column",minHeight:0}}>
    {tab==="dist"&&<DistDir setTab={setTab} scores={scores} ranked={ranked}/>}
    {tab==="plan"&&<PlanPage vars={vars} scores={scores} ranked={ranked} onOpen={()=>setShowPlan(true)} setTab={setTab} phase={phase} setVars={setVars} ans={ans} setPhase={setPhase}/>}
    {tab==="budget"&&<BudgetCalc/>}
    {tab==="brand"&&<BrandBrainstorm/>}
    </div>

    {showPlan&&<PlanModal vars={vars||bv(DEF)} scores={scores||Object.fromEntries(CHANNELS.map(ch=>[ch.id,sc(ch.id,bv(DEF))]))} ranked={ranked.length?ranked:[...CHANNELS].sort((a,b)=>sc(b.id,bv(DEF))-sc(a.id,bv(DEF)))} onClose={()=>setShowPlan(false)}/>}
    {tab==="strategy"&&<>
      {wt&&wtCh&&<WalkModal ch={wtCh} wt={WT[wt]} score={scores[wt]} onClose={()=>setWt(null)} setTab={setTab}/>}

      {phase==="brief"&&<div>
        <div style={{background:C.dark,padding:"clamp(16px,3vw,24px) clamp(12px,3vw,16px)",textAlign:"center",position:"relative",overflow:"hidden"}}>
          <svg style={{position:"absolute",top:8,right:16,opacity:0.7,filter:"drop-shadow(0 0 8px #ff6b2b) drop-shadow(0 0 20px #ff6b2b88)"}} width="44" height="44" viewBox="0 0 44 44" fill="none"><path d="M22 2 L24.5 19.5 L42 22 L24.5 24.5 L22 42 L19.5 24.5 L2 22 L19.5 19.5 Z" fill="#ff6b2b" fillOpacity="0.9"/><path d="M22 8 L23.5 20.5 L36 22 L23.5 23.5 L22 36 L20.5 23.5 L8 22 L20.5 20.5 Z" fill="none" stroke="#ffd23f" strokeWidth="1" strokeOpacity="0.6"/></svg>
          <svg style={{position:"absolute",bottom:8,left:14,opacity:0.55,filter:"drop-shadow(0 0 6px #ffd23f) drop-shadow(0 0 14px #ffd23f88)"}} width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 1 L15.8 12.2 L27 14 L15.8 15.8 L14 27 L12.2 15.8 L1 14 L12.2 12.2 Z" fill="#ffd23f" fillOpacity="0.85"/><path d="M14 5 L15.2 12.8 L23 14 L15.2 15.2 L14 23 L12.8 15.2 L5 14 L12.8 12.8 Z" fill="none" stroke="#fff" strokeWidth="0.8" strokeOpacity="0.5"/></svg>
          <svg style={{position:"absolute",top:12,left:"42%",opacity:0.35,filter:"drop-shadow(0 0 5px #ff6b2b)"}} width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 1 L10.2 7.8 L17 9 L10.2 10.2 L9 17 L7.8 10.2 L1 9 L7.8 7.8 Z" fill="#ff6b2b" fillOpacity="0.7"/></svg>
          <svg style={{position:"absolute",top:6,left:"22%",opacity:0.5,filter:"drop-shadow(0 0 7px #a855f7) drop-shadow(0 0 16px #a855f788)"}} width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 1 L12.6 9.4 L21 11 L12.6 12.6 L11 21 L9.4 12.6 L1 11 L9.4 9.4 Z" fill="#a855f7" fillOpacity="0.8"/><path d="M11 4 L12.1 9.9 L18 11 L12.1 12.1 L11 18 L9.9 12.1 L4 11 L9.9 9.9 Z" fill="none" stroke="#fff" strokeWidth="0.7" strokeOpacity="0.45"/></svg>
          <svg style={{position:"absolute",bottom:6,right:"28%",opacity:0.45,filter:"drop-shadow(0 0 6px #06d6a0) drop-shadow(0 0 12px #06d6a066)"}} width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1 L9.1 6.9 L15 8 L9.1 9.1 L8 15 L6.9 9.1 L1 8 L6.9 6.9 Z" fill="#06d6a0" fillOpacity="0.85"/></svg>
          <svg style={{position:"absolute",top:"30%",right:"18%",opacity:0.3,filter:"drop-shadow(0 0 5px #ffd23f)"}} width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1 L6.9 5.1 L11 6 L6.9 6.9 L6 11 L5.1 6.9 L1 6 L5.1 5.1 Z" fill="#ffd23f" fillOpacity="0.9"/></svg>
          <svg style={{position:"absolute",bottom:"20%",left:"35%",opacity:0.25,filter:"drop-shadow(0 0 4px #ff6b2b)"}} width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M5 1 L5.8 4.2 L9 5 L5.8 5.8 L5 9 L4.2 5.8 L1 5 L4.2 4.2 Z" fill="#ff6b2b" fillOpacity="0.8"/></svg>
          <svg style={{position:"absolute",top:"55%",left:"8%",opacity:0.4,filter:"drop-shadow(0 0 6px #f472b6) drop-shadow(0 0 12px #f472b655)"}} width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 1 L11.4 8.6 L19 10 L11.4 11.4 L10 19 L8.6 11.4 L1 10 L8.6 8.6 Z" fill="#f472b6" fillOpacity="0.75"/><path d="M10 4 L11 8.7 L16 10 L11 11 L10 16 L9 11 L4 10 L9 8.7 Z" fill="none" stroke="#fff" strokeWidth="0.6" strokeOpacity="0.4"/></svg>
          <div style={{display:"inline-block",background:C.orange,color:"#fff",fontSize:15,fontWeight:800,letterSpacing:"0.1em",textTransform:"uppercase",padding:"5px 16px",borderRadius:99,marginBottom:14}}>Zero BS Skincare</div>
          <h1 style={{fontSize:26,fontWeight:900,color:"#fff",margin:"0 0 9px",letterSpacing:"-0.3px"}}>US Market Entry Strategy Generator</h1>
          <p style={{fontSize:17,color:"#fff",margin:0,lineHeight:1.7}}>Answer {STEPS.length} quick sections — we'll show you exactly where to sell first.<br/><span style={{color:C.yellow,fontWeight:700}}>You can skip any question you're not sure about.</span></p>
        </div>
        <div style={{maxWidth:580,margin:"0 auto",padding:"clamp(16px,3vw,24px) clamp(12px,3vw,16px)"}}>
          <Dots cur={step} tot={STEPS.length} cols={cols}/>
          <div className="fadein" style={{background:"#fff",border:`2px solid ${cur.color}33`,borderRadius:20,padding:"26px 22px",marginBottom:22,boxShadow:`0 4px 20px ${cur.color}12`}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
              <div style={{width:48,height:48,borderRadius:14,background:`${cur.color}18`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:23,flexShrink:0}}>{cur.icon}</div>
              <div><div style={{fontSize:15,fontWeight:800,color:cur.color,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:3}}>Step {step+1} of {STEPS.length}</div><h2 style={{fontSize:20,fontWeight:900,color:C.dark,margin:0}}>{cur.title}</h2></div>
            </div>
            <p style={{fontSize:16,color:"#3d4452",marginBottom:24,lineHeight:1.7,paddingLeft:0}}>{cur.subtitle}</p>
            {cur.fields.map(f=><div key={f.id} style={{marginBottom:20}}><label style={{display:"block",fontSize:17,fontWeight:700,color:"#1e2532",marginBottom:5}}>{f.label}</label>{f.hint&&<p style={{fontSize:15,color:"#4b5563",marginBottom:7,lineHeight:1.55}}>{f.hint}</p>}<Fld f={f} value={ans[f.id]} onChange={v=>setAns(p=>({...p,[f.id]:v}))}/></div>)}
            <div style={{marginTop:10,padding:"11px 15px",background:`${cur.color}0f`,borderRadius:10,display:"flex",alignItems:"center",gap:9}}><span style={{fontSize:17}}>💡</span><span style={{fontSize:15,color:"#3d4452",lineHeight:1.6}}>Not sure? <strong style={{color:cur.color}}>Just skip it</strong> — we'll use a sensible default and you can adjust everything after.</span></div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            {step>0?<button onClick={()=>setStep(s=>s-1)} style={{padding:"13px 22px",borderRadius:99,fontSize:17,fontWeight:700,color:"#555",background:"#fff",border:"2px solid #d0d5de"}}>← Back</button>:<div/>}

              <button onClick={go} style={{padding:"13px 20px",borderRadius:99,fontSize:16,fontWeight:700,color:"#555",background:"#fff",border:"2px solid #d8dde6"}}>Skip →</button>
              <button onClick={()=>{setVars(bv({...DEF,...ans}));setPhase("sim");}} style={{padding:"13px 20px",borderRadius:99,fontSize:16,fontWeight:700,color:"#555",background:"#fff",border:"2px solid #d8dde6",display:"flex",alignItems:"center",gap:6}}>⚡ Skip all</button>
              <button onClick={go} style={{padding:"13px 28px",borderRadius:99,fontSize:17,fontWeight:800,background:`linear-gradient(135deg,${cur.color},${cur.color}bb)`,color:"#fff",boxShadow:`0 4px 16px ${cur.color}40`}}>{step<STEPS.length-1?"Next →":"See results →"}</button>
            </div>
          </div>

      </div>}

      {phase==="sim"&&(()=>{
        const top=ranked[0];
        const topScore=scores[top.id];
        const topTierColor=topScore>=70?"#06d6a0":topScore>=50?"#f59e0b":"#f43f5e";
        const topOpen=exCh===top.id;
        const medals=["🥇","🥈","🥉","4️⃣","5️⃣","6️⃣","7️⃣","8️⃣","9️⃣","🔟"];
        return(<>
          <div style={{background:"#e8ecf2",borderBottom:"1px solid #d8dde6",padding:"10px 18px",display:"flex",alignItems:"center",gap:9}}>
            <span style={{fontSize:17}}>💡</span>
            <span style={{fontSize:15,color:"#4a5568",lineHeight:1.6}}><strong>Cost & price cards</strong> show both a <strong>$ amount</strong> and a <strong>% of price</strong> — edit either one and the other updates automatically.</span>
          </div>
          <div style={{maxWidth:1280,margin:"0 auto",padding:"22px 16px"}}>
            <div className="sim-layout">
              <div>
                <div style={{marginBottom:16}}><h2 style={{fontSize:19,fontWeight:900,color:C.dark,margin:"0 0 4px"}}>Adjust your numbers</h2><p style={{fontSize:16,color:"#3d4452",lineHeight:1.6}}>Drag a slider or type into any field. Scores update instantly.</p></div>
                <div className="grid-2">{VM.map(v=><VCard key={v.id} v={v} val={vars[v.id]} msrp={vars.msrp} onChange={n=>sv(v.id,n)}/>)}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:16}}>
                {/* Hero card */}
                <div className="fadein" style={{background:`linear-gradient(135deg,${top.color}22,${top.color}06)`,border:`2.5px solid ${top.color}`,borderRadius:20,overflow:"hidden"}}>
                  <div style={{padding:"22px",cursor:"pointer"}} onClick={()=>setExCh(topOpen?null:top.id)}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12,flexWrap:"wrap",gap:8}}>
                      <span style={{background:top.color,color:"#fff",padding:"4px 12px",borderRadius:99,fontSize:16,fontWeight:800}}>⭐ Best channel right now</span>
                      <span style={{fontSize:16,color:top.color,fontWeight:700}}>{topOpen?"▲ hide details":"▼ score details"}</span>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
                      <div style={{flex:"1 1 180px",minWidth:0}}>
                        <div style={{fontSize:24,fontWeight:900,color:C.dark,lineHeight:1.15,marginBottom:7}}>{top.label}</div>
                        <div style={{fontSize:16,color:"#444",lineHeight:1.65,marginBottom:12}}>{top.desc}</div>
                        <div style={{display:"flex",gap:9,flexWrap:"wrap"}}>
                          <button onClick={e=>{e.stopPropagation();setWt(top.id);}} style={{padding:"10px 18px",borderRadius:99,fontSize:15,fontWeight:800,background:topTierColor,color:"#fff",transition:"background 0.4s"}}>View entry guide →</button>
                          <button onClick={e=>{e.stopPropagation();setTab("dist");}} style={{padding:"10px 18px",borderRadius:99,fontSize:15,fontWeight:800,background:"#fff",color:top.color,border:`2px solid ${top.color}`}}>Find distributors →</button>
                        </div>
                      </div>
                      <div style={{background:"#fff",borderRadius:16,padding:"14px 20px",textAlign:"center",boxShadow:`0 4px 18px ${top.color}33`,flexShrink:0,alignSelf:"flex-start"}}>
                        <div style={{fontSize:48,fontWeight:900,color:topTierColor,lineHeight:1}}>{topScore}</div>
                        <div style={{fontSize:15,color:"#555",marginTop:2}}>out of 100</div>
                      </div>
                    </div>
                  </div>
                  {topOpen&&<ScoreBreakdown ch={top} vars={vars}/>}
                </div>

                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
                  <h2 style={{fontSize:17,fontWeight:900,color:C.dark,margin:"2px 0 0"}}>All channels — ranked for you</h2>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    {dragOrder&&<button onClick={()=>setDragOrder(null)} style={{fontSize:12,fontWeight:700,color:"#06d6a0",background:"#f0fdf4",border:"1.5px solid #06d6a044",borderRadius:99,padding:"3px 10px",cursor:"pointer"}}>↺ Reset order</button>}
                    {hiddenIds.size>0&&<span style={{fontSize:13,color:"#888",fontStyle:"italic"}}>{hiddenIds.size} hidden ↓</span>}
                  </div>
                </div>
                <div style={{fontSize:12,color:"#aaa",marginTop:1,marginBottom:2}}>⠿ Drag any card to reorder &nbsp;·&nbsp; Hide ✕ to remove</div>

                {(()=>{
                  const base=(dragOrder||ranked.map(c=>c.id)).map(id=>ranked.find(c=>c.id===id)).filter(Boolean);
                  return base.map((ch,i)=>{
                  const s=scores[ch.id];
                  const tier=s>=70?"Great fit":s>=50?"Worth exploring":"Challenging";
                  const tc=s>=70?"#06d6a0":s>=50?"#f59e0b":"#f43f5e";
                  const open=exCh===ch.id;
                  const origRank=ranked.findIndex(c=>c.id===ch.id);
                  if(hiddenIds.has(ch.id))return null;
                  return(<div key={ch.id}
                    draggable
                    onDragStart={()=>onDragStart(ch.id)}
                    onDragOver={e=>onDragOver(e,ch.id,base.map(c=>c.id))}
                    onDragEnd={onDragEnd}
                    style={{background:"#fff",border:`2px solid ${open?ch.color:tc+"44"}`,borderRadius:16,overflow:"hidden",transition:"border 0.2s",cursor:"grab"}}>
                    <div onClick={()=>setExCh(open?null:ch.id)} style={{padding:"15px 18px",display:"flex",gap:12,alignItems:"flex-start",cursor:"pointer"}}>
                      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,flexShrink:0,marginTop:2}}>

                        <div style={{fontSize:15,color:"#ccc",userSelect:"none",cursor:"grab"}}>⠿</div>
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:17,fontWeight:800,color:C.dark,marginBottom:2,display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>

                        </div>
                        <div style={{fontSize:15,color:"#3d4452",marginBottom:8,lineHeight:1.55,wordBreak:"break-word"}}>{ch.desc}</div>
                        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{(INS[ch.id]||[]).slice(0,3).map(ins=>{const val=ins.f(vars);const ok=val.startsWith("✅"),w=val.startsWith("⚠️");return <span key={ins.l} style={{fontSize:14,fontWeight:700,padding:"2px 8px",borderRadius:99,background:ok?"#f0fdf4":w?"#fff8e6":"#fff1f1",color:ok?"#16a34a":w?"#d97706":"#dc2626"}}>{val.slice(0,2)} {ins.l}</span>;})}</div>

                  </div>);
                });})()}

                {hiddenIds.size>0&&<div style={{background:"#f8f9fb",border:"2px dashed #d0d5de",borderRadius:14,padding:"14px 16px"}}>
                  <div style={{fontSize:13,fontWeight:800,color:"#999",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>Hidden — tap to show again</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
                    {ranked.filter(ch=>hiddenIds.has(ch.id)).map(ch=>{
                      const s=scores[ch.id];const tc=s>=70?"#06d6a0":s>=50?"#f59e0b":"#f43f5e";
                      return(<button key={ch.id} onClick={()=>toggleHide(ch.id)} style={{display:"flex",alignItems:"center",gap:7,padding:"7px 12px",background:"#fff",border:`2px solid ${tc}44`,borderRadius:99,cursor:"pointer",fontSize:14,fontWeight:700,color:C.dark}}>
                        <span>{ch.label}</span>
                        <span style={{fontWeight:900,color:tc}}>{s}</span>
                        <span style={{color:"#06d6a0",fontWeight:900,fontSize:13}}>＋</span>
                      </button>);
                    })}
                  </div>
                </div>}

                {/* Score legend */}
                <div style={{background:"#fff",border:"2px solid #e4e8ef",borderRadius:14,padding:"15px 17px"}}>
                  <div style={{fontWeight:900,fontSize:16,color:C.dark,marginBottom:10}}>What do these scores mean?</div>
                  <div style={{display:"flex",flexDirection:"column",gap:7}}>{[{dot:"#06d6a0",range:"70–100",label:"Great fit",desc:"This channel suits your brand. Prioritise it."},{dot:"#f59e0b",range:"50–69",label:"Worth exploring",desc:"Possible but some friction — adjust to improve."},{dot:"#f43f5e",range:"Under 50",label:"Challenging",desc:"Real hurdles — not the best place to start."}].map(r=><div key={r.label} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 12px",background:"#f4f6f9",borderRadius:10}}><div style={{width:10,height:10,borderRadius:"50%",background:r.dot,flexShrink:0,marginTop:5}}/><div><div style={{fontSize:16,fontWeight:800,color:C.dark}}>{r.range} — {r.label}</div><div style={{fontSize:15,color:"#3d4452",lineHeight:1.5}}>{r.desc}</div></div></div>)}</div>
                </div>

              </div>
            </div>
          </div>
        </>);
      })()}
    </>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
